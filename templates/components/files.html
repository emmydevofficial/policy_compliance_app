{% if files %}<ul class="files">{% for f in files %}<li><a href="{% if kind == 'request' %}{% url 'requests:attachment_download' f.pk %}{% else %}{% url 'requests:evidence_download' f.pk %}{% endif %}">{{ f.original_filename }}</a> <span class="muted small">{{ f.size_bytes|filesizeformat }}{% if f.description %} · {{ f.description }}{% endif %} · <span class="mono" title="SHA-256 {{ f.sha256 }}">{{ f.sha256|slice:":12" }}…</span></span></li>{% endfor %}</ul>{% else %}<p class="muted">No files.</p>{% endif %}
