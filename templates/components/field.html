<div class="field">{% if field.field.widget.input_type == "checkbox" %}<label class="check">{{ field }} {{ field.label }}</label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted small">(required)</span>{% endif %}</label>{{ field }}{% endif %}{% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>
