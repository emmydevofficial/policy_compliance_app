[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"apps/notifications/defaults.py" = ["E501"]  # email prose, one paragraph per line
