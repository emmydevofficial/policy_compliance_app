# /etc/nginx/sites-available/obligation-desk
upstream obligation_desk { server unix:/run/obligation-desk/gunicorn.sock fail_timeout=0; }

server {
    listen 80;
    server_name obligationdesk.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name obligationdesk.example.org;
    ssl_certificate     /etc/ssl/obligation-desk/fullchain.pem;
    ssl_certificate_key /etc/ssl/obligation-desk/privkey.pem;

    # Must be at least MAX_UPLOAD_MB, times the number of files in one form.
    client_max_body_size 100m;

    location /static/ {
        alias /srv/obligation-desk/app/staticfiles/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    # Evidence files. Never reachable directly: only Django's permission-checked view can
    # hand a request here, through X-Accel-Redirect. Keep USE_X_ACCEL_REDIRECT=True and
    # X_ACCEL_PREFIX=/protected/ in .env.
    location /protected/ {
        internal;
        alias /srv/obligation-desk/private_media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://obligation_desk;
    }
}
