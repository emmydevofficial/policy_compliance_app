# /etc/nginx/sites-available/obligation-desk
# Plain HTTP. With a domain, certbot --nginx adds HTTPS and the redirect to this file
# (VPS-QUICKSTART.md step 9A). Replace SERVER_NAME_HERE with the domain or the server IP.
upstream obligation_desk { server unix:/run/obligation-desk/gunicorn.sock fail_timeout=0; }

server {
    listen 80;
    server_name SERVER_NAME_HERE;

    # At least MAX_UPLOAD_MB times the number of files in one form.
    client_max_body_size 100m;

    location /static/ {
        alias /srv/obligation-desk/app/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Evidence files: only reachable through Django's permission-checked download view,
    # which answers with X-Accel-Redirect. "internal" makes direct requests return 404.
    location /protected/ {
        internal;
        alias /srv/obligation-desk/private_media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://obligation_desk;
    }
}
